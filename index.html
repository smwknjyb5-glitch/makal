 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مقالات نجيب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-deep:#070b1a;
    --navy:#0e1630;
    --navy-card:#121c3d;
    --navy-card-hover:#16214a;
    --gold:#d4af37;
    --gold-soft:#f0d798;
    --gold-dim:rgba(212,175,55,.25);
    --ink:#eef1fb;
    --muted:#8b94ba;
    --border:rgba(212,175,55,.18);
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--navy-deep);
    color:var(--ink);
    font-family:'Tajawal',sans-serif;
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
  }
  #starfield{
    position:fixed;
    inset:0;
    z-index:0;
    display:block;
  }
  a{color:var(--gold-soft);}

  /* ---------- Layout shells ---------- */
  .hero, main{
    position:relative;
    z-index:1;
  }

  .hero{
    text-align:center;
    padding:88px 24px 56px;
  }
  .hero .eyebrow{
    font-size:13px;
    letter-spacing:.12em;
    color:var(--gold);
    text-transform:uppercase;
    margin-bottom:14px;
    opacity:.85;
  }
  .hero h1{
    font-family:'Amiri',serif;
    font-weight:700;
    font-size:clamp(38px,7vw,64px);
    margin:0 0 14px;
    background:linear-gradient(180deg,#fff 0%, var(--gold-soft) 65%, var(--gold) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    letter-spacing:.01em;
  }
  .hero .subtitle{
    font-size:17px;
    color:var(--muted);
    max-width:520px;
    margin:0 auto 22px;
    line-height:1.9;
  }
  .hero .stats{
    display:inline-block;
    font-size:13px;
    color:var(--gold-soft);
    border:1px solid var(--border);
    background:rgba(212,175,55,.06);
    padding:7px 18px;
    border-radius:999px;
    letter-spacing:.02em;
  }

  main{
    max-width:960px;
    margin:0 auto;
    padding:0 20px 100px;
  }

  /* ---------- Add article panel ---------- */
  .panel{
    background:linear-gradient(180deg, var(--navy-card), var(--navy));
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:28px;
    margin-bottom:52px;
    box-shadow:0 20px 60px -30px rgba(0,0,0,.7);
  }
  .panel h2{
    font-family:'Amiri',serif;
    font-size:22px;
    margin:0 0 18px;
    color:var(--gold-soft);
    display:flex;
    align-items:center;
    gap:10px;
  }
  .panel h2::before{
    content:"";
    width:8px;height:8px;
    border-radius:50%;
    background:var(--gold);
    box-shadow:0 0 8px 2px var(--gold-dim);
  }
  .field{margin-bottom:14px;}
  .field label{
    display:block;
    font-size:12.5px;
    color:var(--muted);
    margin-bottom:6px;
    letter-spacing:.02em;
  }
  input[type=text], textarea{
    width:100%;
    background:var(--navy-deep);
    border:1px solid var(--border);
    border-radius:10px;
    color:var(--ink);
    font-family:'Tajawal',sans-serif;
    font-size:15px;
    padding:12px 14px;
    outline:none;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  input[type=text]:focus, textarea:focus{
    border-color:var(--gold);
    box-shadow:0 0 0 3px var(--gold-dim);
  }
  textarea{
    min-height:180px;
    line-height:1.9;
    resize:vertical;
  }
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media (max-width:600px){.row2{grid-template-columns:1fr;}}

  .btn{
    appearance:none;
    border:none;
    cursor:pointer;
    font-family:'Tajawal',sans-serif;
    font-weight:700;
    font-size:15px;
    padding:12px 26px;
    border-radius:10px;
    transition:transform .12s ease, box-shadow .12s ease, opacity .12s ease;
  }
  .btn-gold{
    background:linear-gradient(180deg, var(--gold-soft), var(--gold));
    color:#1a1406;
  }
  .btn-gold:hover{transform:translateY(-1px);box-shadow:0 8px 22px -8px rgba(212,175,55,.6);}
  .btn-ghost{
    background:transparent;
    color:var(--muted);
    border:1px solid var(--border);
  }
  .btn-ghost:hover{color:var(--ink);border-color:var(--gold-dim);}
  .btn-row{display:flex;justify-content:flex-end;gap:10px;margin-top:6px;}
  .hint{font-size:12.5px;color:var(--muted);margin-top:8px;}

  /* ---------- Toast notification ---------- */
  .toast{
    position:fixed;
    bottom:24px;
    left:50%;
    transform:translateX(-50%) translateY(100px);
    background:linear-gradient(135deg, var(--navy-card), var(--navy));
    border:1px solid var(--gold);
    color:var(--gold-soft);
    padding:14px 28px;
    border-radius:60px;
    font-weight:500;
    font-size:15px;
    box-shadow:0 12px 40px -12px rgba(0,0,0,.7);
    transition:transform .4s cubic-bezier(.34,1.56,.64,1), opacity .4s ease;
    opacity:0;
    z-index:30;
    display:flex;
    align-items:center;
    gap:10px;
    pointer-events:none;
  }
  .toast.show{
    transform:translateX(-50%) translateY(0);
    opacity:1;
    pointer-events:auto;
  }
  .toast.error{
    border-color:#c0392b;
    color:#f5b7b1;
  }

  /* ---------- Toolbar ---------- */
  .toolbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    margin-bottom:22px;
    flex-wrap:wrap;
  }
  .toolbar h2{
    font-family:'Amiri',serif;
    font-size:20px;
    margin:0;
    color:var(--ink);
  }
  .search-wrap{position:relative;flex:1;min-width:220px;max-width:340px;}
  .search-wrap input{padding-right:38px;}
  .search-wrap svg{
    position:absolute;
    right:12px;top:50%;transform:translateY(-50%);
    opacity:.5;pointer-events:none;
  }

  /* ---------- Grid & cards ---------- */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(260px,1fr));
    gap:18px;
  }
  .card{
    background:var(--navy-card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:20px;
    cursor:pointer;
    position:relative;
    transition:transform .15s ease, background .15s ease, border-color .15s ease;
    display:flex;
    flex-direction:column;
    min-height:190px;
  }
  .card:hover, .card:focus-visible{
    background:var(--navy-card-hover);
    border-color:var(--gold-dim);
    transform:translateY(-3px);
  }
  .card:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  .card canvas.constellation{
    position:absolute;
    top:14px; left:14px;
    width:46px;height:46px;
    opacity:.9;
  }
  .card h3{
    font-family:'Amiri',serif;
    font-size:18px;
    margin:0 0 8px;
    padding-left:56px;
    color:var(--gold-soft);
    line-height:1.5;
  }
  .card p.excerpt{
    font-size:13.5px;
    color:var(--muted);
    line-height:1.85;
    margin:0 0 14px;
    flex:1;
    display:-webkit-box;
    -webkit-line-clamp:4;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .card .meta{
    font-size:11.5px;
    color:var(--muted);
    display:flex;
    justify-content:space-between;
    border-top:1px solid var(--border);
    padding-top:10px;
    opacity:.85;
  }

  .empty-state{
    text-align:center;
    padding:70px 20px;
    color:var(--muted);
    border:1px dashed var(--border);
    border-radius:var(--radius);
  }
  .empty-state .glyph{font-size:30px;margin-bottom:12px;}
  .empty-state p{font-size:14.5px;line-height:1.9;max-width:340px;margin:0 auto;}

  /* ---------- Modal ---------- */
  .modal{
    position:fixed;inset:0;z-index:20;
    background:rgba(4,7,18,.78);
    backdrop-filter:blur(4px);
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:60px 20px;
    overflow-y:auto;
  }
  .modal.hidden{display:none;}
  .modal-content{
    background:linear-gradient(180deg,#141d40,#0e1630);
    border:1px solid var(--border);
    border-radius:18px;
    max-width:680px;
    width:100%;
    padding:38px 34px 30px;
    position:relative;
    box-shadow:0 30px 80px -20px rgba(0,0,0,.8);
  }
  #modal-close{
    position:absolute;
    top:16px; left:16px;
    background:transparent;
    border:1px solid var(--border);
    color:var(--muted);
    width:32px;height:32px;
    border-radius:50%;
    cursor:pointer;
    font-size:16px;
    line-height:1;
    display:flex;align-items:center;justify-content:center;
  }
  #modal-close:hover{color:var(--ink);border-color:var(--gold-dim);}
  #modal-title{
    font-family:'Amiri',serif;
    font-size:26px;
    color:var(--gold-soft);
    margin:0 0 8px;
    padding-left:36px;
    line-height:1.5;
  }
  .modal-meta{
    font-size:12.5px;
    color:var(--muted);
    margin-bottom:20px;
    display:flex;
    gap:14px;
    flex-wrap:wrap;
    border-bottom:1px solid var(--border);
    padding-bottom:18px;
  }
  #modal-body{
    font-size:16px;
    line-height:2.05;
    color:#dfe4f6;
    white-space:pre-wrap;
    margin-bottom:24px;
  }
  .modal-actions{
    display:flex;
    justify-content:flex-end;
    border-top:1px solid var(--border);
    padding-top:18px;
  }
  .btn-danger{
    background:transparent;
    color:#e6a5a5;
    border:1px solid rgba(230,120,120,.3);
  }
  .btn-danger:hover{background:rgba(230,120,120,.08);}

  @media (prefers-reduced-motion: reduce){
    #starfield{display:none;}
  }
</style>
</head>
<body>

<canvas id="starfield"></canvas>

<header class="hero">
  <div class="eyebrow">أرشيف شخصي</div>
  <h1>مقالات نجيب</h1>
  <div class="gallery">
    <img src="kalem.png" width="150" height="200">

</div>
  <p class="subtitle">مجموعة المقالات التي ألتقطها </p>
  <div class="stats" id="stats-badge">لا توجد مقالات بعد</div>
</header>

<main>
  <section class="panel">
    <h2>إضافة مقال جديد</h2>
    <div class="row2">
      <div class="field">
        <label for="title-input"> </label>
        <input type="text" id="title-input" placeholder="عنوان المقال">
      </div>
      <div class="field">
        <label for="source-input">المصدر (اختياري)</label>
        <input type="text" id="source-input" placeholder="اسم المنصة أو رابط">
      </div>
    </div>
    <div class="field">
      <label for="content-input">نص المقال</label>
      <textarea id="content-input" placeholder="الصق نص المقال هنا..."></textarea>
    </div>
    <div class="btn-row">
      <button class="btn btn-ghost" id="clear-btn" type="button">مسح الحقول</button>
      <button class="btn btn-gold" id="save-btn" type="button">حفظ المقال</button>
    </div>
    <div class="hint">تُحفظ المقالات داخل هذا المتصفح فقط (localStorage) — على نفس الجهاز والمتصفح الذي أضفتها منه.</div>
  </section>

  <section>
    <div class="toolbar">
      <h2>المكتبة</h2>
      <div class="search-wrap">
        <input type="text" id="search-input" placeholder="ابحث في العناوين والنصوص...">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8b94ba" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </div>
    </div>
    <div id="articles-grid" class="grid"></div>
  </section>
</main>

<!-- Toast notification -->
<div class="toast" id="toast"></div>

<!-- Modal -->
<div class="modal hidden" id="modal">
  <div class="modal-content">
    <button id="modal-close" aria-label="إغلاق">×</button>
    <h2 id="modal-title"></h2>
    <div class="modal-meta" id="modal-meta"></div>
    <div id="modal-body"></div>
    <div class="modal-actions">
      <button class="btn btn-danger" id="delete-btn" type="button">حذف هذا المقال</button>
    </div>
  </div>
</div>

<script>
/* ===================== Starfield background ===================== */
(function(){
  const canvas = document.getElementById('starfield');
  const ctx = canvas.getContext('2d');
  let w,h,stars=[];
  function resize(){
    w = canvas.width = window.innerWidth;
    h = canvas.height = document.documentElement.scrollHeight;
  }
  function initStars(){
    const count = Math.floor((w*h)/9000);
    stars = Array.from({length:count}, ()=>({
      x: Math.random()*w,
      y: Math.random()*h,
      r: Math.random()*1.4+0.3,
      baseAlpha: Math.random()*0.6+0.2,
      tw: Math.random()*Math.PI*2,
      speed: Math.random()*0.015+0.005
    }));
  }
  function draw(){
    ctx.clearRect(0,0,w,h);
    for(const s of stars){
      s.tw += s.speed;
      const a = s.baseAlpha + Math.sin(s.tw)*0.25;
      ctx.beginPath();
      ctx.fillStyle = `rgba(240,215,152,${Math.max(0,a)})`;
      ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fill();
    }
    requestAnimationFrame(draw);
  }
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  window.addEventListener('resize', ()=>{resize();initStars();});
  resize(); initStars();
  if(!reduced){ draw(); } else {
    ctx.clearRect(0,0,w,h);
    for(const s of stars){
      ctx.beginPath();
      ctx.fillStyle = `rgba(240,215,152,${s.baseAlpha})`;
      ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fill();
    }
  }
})();

/* ===================== Article store ===================== */
const STORAGE_KEY = 'maqalat-najib-articles';

function loadArticles(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  }catch(e){ return []; }
}
function saveArticles(list){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
    return true;
  }catch(e){
    console.error('فشل الحفظ في localStorage:', e);
    return false;
  }
}
let articles = loadArticles();

function wordCount(text){
  return (text.trim().match(/\S+/g) || []).length;
}
function readingTime(text){
  const words = wordCount(text);
  return Math.max(1, Math.round(words/180));
}
function formatDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('ar', {year:'numeric', month:'long', day:'numeric'});
}
function excerptOf(text){
  return text.trim().slice(0,220);
}

/* deterministic pseudo-random from a string, for the per-card constellation */
function seedRandom(seed){
  let h = 0;
  for(let i=0;i<seed.length;i++){ h = (h*31 + seed.charCodeAt(i)) >>> 0; }
  return function(){
    h ^= h << 13; h >>>= 0;
    h ^= h >> 17;
    h ^= h << 5; h >>>= 0;
    return (h % 1000)/1000;
  };
}
function drawConstellation(canvas, id, magnitude){
  const ctx = canvas.getContext('2d');
  const size = 46;
  canvas.width = size; canvas.height = size;
  const rand = seedRandom(id);
  const n = Math.min(7, Math.max(3, Math.round(magnitude/300)+3));
  const pts = Array.from({length:n}, ()=>({
    x: 6 + rand()*(size-12),
    y: 6 + rand()*(size-12)
  }));
  ctx.strokeStyle = 'rgba(212,175,55,.45)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  pts.forEach((p,i)=>{ i===0 ? ctx.moveTo(p.x,p.y) : ctx.lineTo(p.x,p.y); });
  ctx.stroke();
  pts.forEach(p=>{
    ctx.beginPath();
    ctx.fillStyle = '#f0d798';
    ctx.arc(p.x,p.y, 1.6, 0, Math.PI*2);
    ctx.fill();
  });
}

/* ===================== Toast system ===================== */
let toastTimer = null;
function showToast(message, isError = false){
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.className = 'toast' + (isError ? ' error' : '');
  // force reflow for animation
  void toast.offsetHeight;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    toast.classList.remove('show');
  }, 3500);
}

/* ===================== Rendering ===================== */
const grid = document.getElementById('articles-grid');
const statsBadge = document.getElementById('stats-badge');
const searchInput = document.getElementById('search-input');

function render(filter=''){
  const q = filter.trim().toLowerCase();
  const list = articles
    .filter(a => !q || a.title.toLowerCase().includes(q) || a.content.toLowerCase().includes(q))
    .sort((a,b)=> new Date(b.createdAt) - new Date(a.createdAt));

  statsBadge.textContent = articles.length
    ? `عدد المقالات: ${articles.length}`
    : 'لا توجد مقالات بعد';

  grid.innerHTML = '';

  if(articles.length === 0){
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
      <div class="glyph">✦</div>
      <p>السماء ما زالت صافية. الصق أول مقال في الأعلى لتبدأ مجموعتك.</p>
    </div>`;
    return;
  }
  if(list.length === 0){
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
      <div class="glyph">✦</div>
      <p>لا توجد نتائج مطابقة لبحثك.</p>
    </div>`;
    return;
  }

  list.forEach(article=>{
    const card = document.createElement('div');
    card.className = 'card';
    card.tabIndex = 0;
    card.setAttribute('role','button');
    card.innerHTML = `
      <canvas class="constellation"></canvas>
      <h3>${escapeHtml(article.title)}</h3>
      <p class="excerpt">${escapeHtml(excerptOf(article.content))}</p>
      <div class="meta">
        <span>${formatDate(article.createdAt)}</span>
        <span>${readingTime(article.content)} د قراءة</span>
      </div>
    `;
    card.addEventListener('click', ()=>openModal(article.id));
    card.addEventListener('keydown', e=>{ if(e.key==='Enter') openModal(article.id); });
    grid.appendChild(card);
    drawConstellation(card.querySelector('canvas.constellation'), article.id, wordCount(article.content));
  });
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

/* ===================== Add article ===================== */
document.getElementById('save-btn').addEventListener('click', ()=>{
  const title = document.getElementById('title-input').value.trim();
  const source = document.getElementById('source-input').value.trim();
  const content = document.getElementById('content-input').value.trim();

  if(!title){
    showToast('الرجاء كتابة عنوان للمقال', true);
    document.getElementById('title-input').focus();
    return;
  }
  if(!content){
    showToast('الرجاء لصق نص المقال', true);
    document.getElementById('content-input').focus();
    return;
  }

  const article = {
    id: 'a_' + Date.now() + '_' + Math.floor(Math.random()*1000),
    title, source, content,
    createdAt: new Date().toISOString()
  };
  articles.push(article);
  const saved = saveArticles(articles);
  if(!saved){
    showToast('حدث خطأ في الحفظ، تأكد من سعة التخزين', true);
    articles.pop(); // revert
    return;
  }

  // clear fields
  document.getElementById('title-input').value = '';
  document.getElementById('source-input').value = '';
  document.getElementById('content-input').value = '';

  render(searchInput.value);
  showToast('✅ تم حفظ المقال بنجاح!');
});

document.getElementById('clear-btn').addEventListener('click', ()=>{
  if(confirm('هل تريد مسح كل الحقول؟ (لن يتم حفظ البيانات)')) {
    document.getElementById('title-input').value = '';
    document.getElementById('source-input').value = '';
    document.getElementById('content-input').value = '';
    document.getElementById('title-input').focus();
    showToast('تم مسح الحقول', false);
  }
});

/* ===================== Search ===================== */
searchInput.addEventListener('input', ()=> render(searchInput.value));

/* ===================== Modal ===================== */
const modal = document.getElementById('modal');
let currentId = null;

function openModal(id){
  const article = articles.find(a=>a.id===id);
  if(!article) return;
  currentId = id;
  document.getElementById('modal-title').textContent = article.title;
  document.getElementById('modal-body').textContent = article.content;
  const metaParts = [formatDate(article.createdAt), `${wordCount(article.content)} كلمة`, `${readingTime(article.content)} دقائق قراءة`];
  if(article.source) metaParts.push('المصدر: ' + article.source);
  document.getElementById('modal-meta').innerHTML = metaParts.map(m=>`<span>${escapeHtml(m)}</span>`).join('');
  modal.classList.remove('hidden');
}
function closeModal(){
  modal.classList.add('hidden');
  currentId = null;
}
document.getElementById('modal-close').addEventListener('click', closeModal);
modal.addEventListener('click', e=>{ if(e.target === modal) closeModal(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });

document.getElementById('delete-btn').addEventListener('click', ()=>{
  if(!currentId) return;
  if(!confirm('هل تريد حذف هذا المقال نهائياً؟')) return;
  articles = articles.filter(a=>a.id!==currentId);
  saveArticles(articles);
  closeModal();
  render(searchInput.value);
  showToast('🗑️ تم حذف المقال');
});

/* ===================== Init ===================== */
render();
</script>
</body>
</html>
